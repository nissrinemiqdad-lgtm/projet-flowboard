<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowBoard | Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="flowboard-1.css">
</head>

<body>
    <header>
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1>FlowBoard</h1>
                <p>Organisez vos tâches, avancez sereinement.</p>
            </div>

            <button type="button" class="btn btn-primary">
                + Ajouter une tâche
            </button>
        </div>
    </header>
    <section class="container-fluid p-3">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <input type="text" class="form-control" id="search-task" placeholder="Rechercher une tâche...">
            </div>
            <div class="col-md-4">
                <select class="form-select" id="filter-priority">
                    <option value="">Toutes les priorités</option>
                    <option value="low">Basse</option>
                    <option value="medium">Moyenne</option>
                    <option value="high">Haute</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="filter-assignee">
                    <option value="">Tous les responsables</option>
                </select>
            </div>
        </div>
    </section>
    <main class="container-fluid p-3">
        <div class="row g-3">
            <!-- Colonne À faire -->
            <div class="col-md-4">
                <section class="kanban-column">

                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">À faire</h2>
                        <span id="todo-count">0</span>
                    </div>

                    <div id="todo-list">
                        <!-- Carte de test -->
                        <div class="card task-card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Créer la page d'accueil</h5>
                                <p class="card-text">
                                    Préparer la structure HTML du projet.
                                </p>
                                <p class="card-text">
                                    Responsable : Nissrine
                                </p>
                                <p class="card-text">
                                    Date limite : 12/11/2026
                                </p>
                                <span class="badge bg-danger">Haute</span>

                            </div>
                        </div>

                    </div>

                </section>
            </div>

            <!-- Colonne En cours -->
            <div class="col-md-4">
                <section class="kanban-column">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">En cours</h2>
                        <span id="inprogress-count">0</span>
                    </div>
                    <div id="inprogress-list">
                        <!-- Les cartes -->
                    </div>
                </section>
            </div>

            <!-- Colonne Terminé -->
            <div class="col-md-4">
                <section class="kanban-column">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">Terminé</h2>
                        <span id="done-count">0</span>
                    </div>
                    <div id="done-list">
                        <!-- Les cartes -->
                    </div>
                </section>
            </div>

        </div>
    </main>


    <script type="module" src="API/API.js"></script>
    <script type="module" src="UI/UI.js"></script>
</body>

</html>
