<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowBoard | Task Management</title>
    <link rel="stylesheet" href="flowboard-1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="UI.js"></script>

</head>

<body>
    <header class="container-fluid p-3">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="fw-bold mb-1">FlowBoard</h1>
                <p>Organisez vos tâches, avancez sereinement.</p>
            </div>

            <button type="button" class="btn btn-primary" id="add-card-btn">
                + Ajouter une tâche
            </button>
        </div>
    </header>
    <div class="modal fade" id="addCardModal" tabindex="-1" aria-hidden="true"></div>
    
    <div id="loading" class="text-center p-3">Chargement des cartes...</div>
    <div id="error" class="alert alert-danger d-none d-flex justify-content-between align-items-center">
        <p id="error-message"></p>
        <button id="retry-btn" class="btn btn-danger" type="button">
            Réessayer
        </button>
    </div>

    <section class="container-fluid p-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <input type="text" class="form-control" id="search-task" placeholder="Rechercher une tâche...">
            </div>
            <div class="col-md-4">
                <select class="form-control" id="filter-priority">
                    <option value="">Toutes les priorités</option>
                    <option value="low">Basse</option>
                    <option value="medium">Moyenne</option>
                    <option value="high">Haute</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-control" id="filter-assignee">
                    <option value="">Tous les responsables</option>
                </select>
            </div>
        </div>
    </section>

    <main class="container-fluid p-3">
        <div class="row g-3">
            <!-- Colonne À faire -->
            <div class="col-md-4">
                <section class="kanban-column bg-white p-3 mt-3 rounded-3 border border-2">

                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="fs-5 fw-bold mb-0">À faire</h2>
                        <span id="todo-count">0</span>
                    </div>

                    <div id="todo-list">
                    </div>

                </section>
            </div>

            <!-- Colonne En cours -->
            <div class="col-md-4">
                <section class="kanban-column bg-white p-3 mt-3 rounded-3 border border-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="fs-5 fw-bold mb-0">En cours</h2>
                        <span id="inprogress-count">0</span>
                    </div>
                    <div id="inprogress-list">
                        <!-- Les cartes -->
                    </div>
                </section>
            </div>

            <!-- Colonne Terminé -->
            <div class="col-md-4">
                <section class="kanban-column bg-white p-3 mt-3 rounded-3 border border-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="fs-5 fw-bold mb-0">Terminé</h2>
                        <span id="done-count">0</span>
                    </div>
                    <div id="done-list">
                        <!-- Les cartes -->
                    </div>
                </section>
            </div>

        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
